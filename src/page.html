<style>
:root{--bg:#070d1a;--card:#0e1730;--card2:#152246;--line:#2a3b63;--red:#2f7bff;--red2:#7fb2ff;--tx:#f4f7fb;--mu:#a3b1c9;--ok:#36d399;--disp:'Oswald','Arial Narrow',sans-serif;--body:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--body);font-size:16px}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom));min-height:100vh;background:radial-gradient(1200px 500px at 80% -10%,color-mix(in srgb,var(--red) 18%,transparent),transparent 60%),var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;min-height:46px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--red);border-color:var(--red)}
textarea{resize:vertical;min-height:70px}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:14px 0 6px}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:20;background:var(--s92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:12px;height:58px}
.brand{font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:.08em;display:flex;align-items:center;gap:10px}
.brand img{width:40px;height:40px;border-radius:11px}
.brand i{font-style:normal;background:var(--red);color:#fff;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:20px}
.sp{flex:1}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-size:14px;min-height:40px}
nav{overflow-x:auto;scrollbar-width:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--s97);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;flex:1 0 64px;min-height:52px;color:var(--mu);font-size:11px;font-weight:600;letter-spacing:.04em;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:10px}
nav button b{font-size:19px;font-weight:400;filter:grayscale(1) brightness(1.4)}
nav button.on{color:#fff}nav button.on b{filter:none}
nav button.on span{border-bottom:2px solid var(--red)}
h1,h2,h3{font-family:var(--disp);letter-spacing:.04em;text-transform:uppercase;margin:0}
h1{font-size:clamp(26px,4vw,40px)}h2{font-size:20px;margin:22px 0 10px}
.sub{color:var(--mu);font-size:14px;margin-top:4px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.seg button{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:9px 16px;min-height:42px;font-weight:600;font-size:14px;color:var(--mu)}
.seg button.on{background:var(--red);border-color:var(--red);color:#fff}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){.g4{grid-template-columns:repeat(4,1fr)}.gA{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1100px){.gA{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.big{font-family:var(--disp);font-weight:700;font-size:clamp(34px,6vw,64px);line-height:1}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.red{color:var(--red2)}
.kpi{padding:16px}.kpi .big{margin-top:6px}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--red2))}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.team{border-left:4px solid var(--red)}
.pcts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
@media(min-width:760px){.pcts{grid-template-columns:repeat(3,1fr)}}
.pc{background:var(--card2);border-radius:10px;padding:10px}.pc b{display:block;font-family:var(--disp);font-size:22px;margin-top:2px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;text-align:center}
.mini div{background:var(--card2);border-radius:8px;padding:8px 2px}.mini b{display:block;font-family:var(--disp);font-size:18px}.mini span{font-size:10px;color:var(--mu);letter-spacing:.05em;text-transform:uppercase}
.btn{background:var(--red);border:0;border-radius:12px;padding:14px 20px;font-weight:700;font-size:16px;min-height:50px;color:#fff;width:100%}
.btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--tx)}

function shrink(file,max,q){return new Promise(res=>{

  const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q))};img.onerror=()=>{URL.revokeObjectURL(u);res('')};img.src=u})}
